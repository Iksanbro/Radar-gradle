plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// библиотеки, которые чужие моды встраивают jar-in-jar: Sable companion (MIT) и Flywheel (из Create)
def embeddedDir = layout.buildDirectory.dir('embedded').get().asFile
def companionVersion = '1.6.0'

repositories {
    // Modrinth Maven: моды по номеру версии с Modrinth
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net' }
    exclusiveContent {
        forRepository { flatDir { name = 'EmbeddedLibs'; dirs embeddedDir } }
        filter { includeGroup 'dev.ryanhcode.sable-companion' }
    }
}

sourceSets {
    // игровые тесты: участвуют только в dev-запуске, в итоговый jar не попадают
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // jar'ы чужих модов только для компиляции (без транзитивных зависимостей)
    modCompile { transitive = false }
    compileOnly.extendsFrom modCompile
    gametestCompileOnly.extendsFrom modCompile
    gametestImplementation.extendsFrom implementation
    // моды для dev-сервера: копируются в run/mods
    devMods { transitive = false }
    gametestSable { transitive = false }
    embeddedSources { transitive = false }
    gametestCompileOnly.extendsFrom gametestSable
}

dependencies {
    modCompile "maven.modrinth:create:${create_version}"
    modCompile "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    modCompile "maven.modrinth:create-big-cannons:${cbc_version}"
    // Create Radars - необязательная интеграция (компиляция против минимального API)
    modCompile "maven.modrinth:create-radars:${radars_compile_version}"
    embeddedSources "maven.modrinth:sable:${sable_version}"
    embeddedSources "maven.modrinth:create:${create_version}"

    // API Sable для игровых тестов (сборка корабля); в основной код не попадает
    gametestSable "maven.modrinth:sable:${sable_version}"

    // -PfcsMinimal: только обязательные Create + CBC + Create Radars (без Sable и CBC-AT);
    // -PfcsNoCbcAt: без CBC Advanced Technologies
    devMods "maven.modrinth:create:${create_version}"
    devMods "maven.modrinth:create-big-cannons:${cbc_version}"
    devMods "maven.modrinth:rpl:${rpl_version}"
    devMods "maven.modrinth:create-radars:${radars_runtime_version}"
    if (!project.hasProperty('fcsMinimal')) {
        devMods "maven.modrinth:sable:${sable_version}"
        devMods "maven.modrinth:create-aeronautics:${aeronautics_version}"
        if (!project.hasProperty('fcsNoCbcAt')) devMods "maven.modrinth:create-big-cannons-advanced-technologies:${cbcat_version}"
    }
}

// достаём встроенные библиотеки при конфигурации (один раз): companion - в локальный репозиторий для jarJar
def companionJar = new File(embeddedDir, "sable-companion-common-1.21.1-${companionVersion}.jar")
def flywheelJar = new File(embeddedDir, 'flywheel-neoforge-1.21.1.jar')
if (!companionJar.exists() || !flywheelJar.exists()) {
    configurations.embeddedSources.resolvedConfiguration.resolvedArtifacts.each { art ->
        copy {
            from(zipTree(art.file)) {
                include "META-INF/jarjar/sable-companion-common-1.21.1-${companionVersion}.jar"
                include 'META-INF/jarjar/flywheel-neoforge-1.21.1-*.jar'
                eachFile { path = name.startsWith('flywheel') ? 'flywheel-neoforge-1.21.1.jar' : name }
            }
            includeEmptyDirs = false
            into embeddedDir
        }
    }
}
dependencies {
    // Sable companion: без Sable отдаёт пустые результаты; встраиваем, чтобы мод работал без Create Radars и Sable
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${companionVersion}"
    gametestCompileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${companionVersion}"
    jarJar "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${companionVersion}"
    // Flywheel (визуал подшипника радара) - только компиляция, в рантайме его даёт Create
    compileOnly files(flywheelJar)
}

def prepareRunMods = tasks.register('prepareRunMods', Sync) {
    from configurations.devMods
    // без Sable и Create Radars companion в dev-запуске кладём отдельным модом (в jar он встроен)
    if (project.hasProperty('fcsMinimal')) from(companionJar)
    // -PfcsExtraMods=<папка>: дополнительные jar'ы модов не с Modrinth (CurseForge: исправление CBC-AT, CBC Neo Warfare)
    if (project.hasProperty('fcsExtraMods')) from(fileTree(project.property('fcsExtraMods')).matching { include '*.jar' })
    into file('run/mods')
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            gameDirectory = project.file('run')
        }
        client {
            client()
            sourceSet = sourceSets.gametest
            // ./gradlew runClient -PfcsScreenshot: зайти в мир fcs_test, построить сцену и сделать скриншоты
            if (project.hasProperty('fcsScreenshot')) {
                systemProperty 'radar_fcs.screenshot', 'true'
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('fcsWorld') ?: 'fcs_test',
                        '--width', '1280', '--height', '720')
            }
        }
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.gametest
            if (project.hasProperty('fcsAutostop')) systemProperty 'radar_fcs.autostop', 'true'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('fcsProbe')) systemProperty 'radarfcs.probe', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach {
    dependsOn prepareRunMods
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// офлайн-тест баллистики и треков (без Minecraft): ./gradlew coreTest
tasks.register('coreTest', JavaExec) {
    group = 'verification'
    description = 'Runs the offline ballistic/track self-test (core package only).'
    dependsOn tasks.named('compileJava')
    def devtools = layout.projectDirectory.dir('devtools')
    def outDir = layout.buildDirectory.dir('devtools')
    doFirst {
        def out = outDir.get().asFile
        out.mkdirs()
        def javac = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile
        def coreClasses = sourceSets.main.output.classesDirs.asPath
        def proc = [javac.absolutePath, '-d', out.absolutePath, '-cp', coreClasses,
                    devtools.file('SolverTest.java').asFile.absolutePath].execute()
        proc.waitForProcessOutput(System.out, System.err)
        if (proc.exitValue() != 0) throw new GradleException('devtools compilation failed')
    }
    classpath = files(outDir, sourceSets.main.output.classesDirs)
    mainClass = 'SolverTest'
}
